name: fedavg_mnist
seed: 0
data: {name: mnist, num_clients: 10, alpha: 0.5, partition_on: label}
model: {kind: cnn}
train: {rounds: 20, clients_per_round: 0.5, local_epochs: 1, batch_size: 64, lr: 0.05}
strategy: {name: fedavg}
fairness:
  status: {benefit: accuracy, level: clients, accumulation: cumulative}
  scope: {kind: anytime}
  epsilon: 0.05
