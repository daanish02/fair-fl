# Wang et al., ICLR 2024. Main CIFAR-10 setup (Section 6.1): 20 clients, 20% sampled
# per round, local epoch=20, batch size=64, lr=1e-3, SGD momentum=1e-4, weight
# decay=1e-5, 200 communication rounds, model = ResNet-18. FedCDA params: K=3 (cached
# models/client), B=3 (num_batches), warmup=50 rounds, L=1 (smoothness, shared across
# clients per the paper's own stated limitation). Partition: Dirichlet(0.1/0.3/0.5) or
# shard-based (2/4/8 shards) -- using Dirichlet(0.5) here for consistency with the
# other 7 strategies' default partitioning.
# See docs/impl-papers/FEDCDA - Federated Learning With Cross-Round Divergence-Aware
# Aggregation.txt.
dataset:
  num_clients: 20
  alpha: 0.5
model:
  name: resnet18
train:
  rounds: 200
  clients_per_round: 0.2
  local_epochs: 20
  lr: 0.001
  momentum: 0.0001
  weight_decay: 0.00001
  batch_size: 64
strategy:
  name: fedcda
  params:
    K: 3
    num_batches: 3
    smoothness: 1.0
    warmup: 50
