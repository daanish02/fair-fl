# FedCDA Table 1 (fmnist): FedAvg vs FedCDA, shards 2/4/8 and Dirichlet 0.1/0.3/0.5; seed 0. CPU-feasible but slow (20 local epochs); GPU recommended.
name: repro_fedcda
runs:
- config: configs/repro/fedcda/fmnist_cnn.yaml
  seeds:
  - 0
  set:
    name: fedcda_fmnist_dir0.1_fedavg
    data.name: fmnist
    model:
      kind: cnn_fmnist
    strategy:
      name: fedavg
      params: {}
    data.partition_on: label
    data.alpha: 0.1
- config: configs/repro/fedcda/fmnist_cnn.yaml
  seeds:
  - 0
  set:
    name: fedcda_fmnist_dir0.1_fedcda
    data.name: fmnist
    model:
      kind: cnn_fmnist
    strategy:
      name: fedcda
      params:
        K: 3
        num_batches: 3
        smoothness: 1.0
        warmup: 50
    data.partition_on: label
    data.alpha: 0.1
