# FairWeight Table II (R3C, DP-constrained): FedAvg row vs FairWeight on Adult / Bank / Default / Law; seed 0.
# CPU only (small tabular data; not in the Colab notebook).
name: repro_fairweight
runs:
- config: configs/repro/fairweight/r3c.yaml
  seeds:
  - 0
  set:
    name: fairweight_r3c_adult_fedavg
    data.name: fw_adult
    strategy:
      name: fairweight_official
      params:
        fair_loss: none
        aggregation: mean
